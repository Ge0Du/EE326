    <a href="index.html">Home</a>

  <h1>Webcam</h1>
  <hr>

  <img id="webcamImage" src="" alt="webcam stream" width="640"><br>

  <p>Time: <span id="clockDisplay">--</span></p>
  <p>Last frame: <span id="timestamp">N/A</span></p>
  <p>FPS: <span id="fpsDisplay">0</span></p>
  <p>Status: <span id="statusText">Not connected</span></p>

  <br>
  <button id="streamToggle" onclick="toggleStream()">Start Stream</button>

  <p><small>Note: may take a moment to stop after clicking Stop. This is normal.</small></p>

  <script src="webcam_functions.js"></script>
</body>
